# Render blueprint. If your service already exists you do not need this file: just push, and set the
# environment variables listed here in the dashboard (Environment tab).
services:
  - type: web
    name: poly-x-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: POLYX_AUTOARM
        value: "1"
      - key: CORS_ORIGINS
        sync: false   # your frontend origin, e.g. https://poly-x.vercel.app
      - key: GROQ_API_KEY
        sync: false
      - key: POLYX_ADMIN_TOKEN
        generateValue: true
