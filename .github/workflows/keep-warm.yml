# Keeps a free Render instance from sleeping during the finale window.
# Set the repository variable POLYX_API, then enable this workflow. GitHub cron is best-effort (it can run
# several minutes late), so ALSO add an external monitor that pings /healthz every 5 minutes for the demo days.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        env:
          POLYX_API: ${{ vars.POLYX_API }}
        run: |
          test -n "$POLYX_API" || { echo "Set the POLYX_API repository variable"; exit 0; }
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 60 "$POLYX_API/api/v1/health" | head -c 300
